<title>RE:NOOB 월드맵</title>
<meta name="description" content="RE:NOOB 서버 오픈월드 지도(계획안)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#07090C; --panel:rgba(16,20,26,.92); --panel-2:#1B222C; --line:#2A3440; --ink:#E6EBF0; --muted:#8E9AA8;
  --accent:#3B7BF0; --accent-ink:#FFFFFF; --warn:#FF5A5A; --gold:#F3C44B;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14px; margin:0; overflow:hidden}
#map{position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; background:var(--bg)}
#map.drag{cursor:grabbing}
#stage{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
#stage img{position:absolute; display:block; user-select:none; -webkit-user-drag:none; max-width:none}
#stage.px img{image-rendering:pixelated}
#zones{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
#grid{position:absolute; inset:0; pointer-events:none}
#pins{position:absolute; inset:0; pointer-events:none}
.pin{position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap}
.pin .ic{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; background:#0C1016; border:1.5px solid var(--c); box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pin .ic svg{width:14px; height:14px; fill:var(--c)}
.pin .lb{font-size:12px; font-weight:700; color:#fff; text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
.pin.small .lb{display:none}
.pin:hover .lb,.pin.sel .lb{display:inline}
.pin.sel .ic{outline:2px solid #fff; outline-offset:2px}
.pin:focus-visible .ic{outline:2px solid var(--accent); outline-offset:2px}

.hud{position:fixed; z-index:5}
.tl{top:calc(env(safe-area-inset-top,0px) + 28px); left:14px; display:grid; gap:8px; max-width:calc(100vw - 28px)}
.brand{display:flex; align-items:baseline; gap:8px}
.brand b{font-size:16px; letter-spacing:.02em}
.brand span{font-size:12px; color:var(--muted)}
.row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.btn{font:inherit; font-size:13px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:7px; padding:7px 12px; cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.icon{padding:7px 9px; display:grid; place-items:center}
.btn.icon svg{width:16px; height:16px; fill:currentColor}
.btn:focus-visible,.sw:focus-visible,.search input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; display:grid; gap:4px; min-width:230px; box-shadow:0 8px 24px rgba(0,0,0,.5)}
.panel h3{margin:0 0 6px; font-size:11px; font-weight:500; letter-spacing:.08em; color:var(--muted)}
.sw{font:inherit; display:flex; justify-content:space-between; align-items:center; gap:18px; background:none; border:0; color:var(--ink); padding:6px 2px; cursor:pointer; font-size:13px; text-align:left}
.sw b{font-size:12px; color:var(--muted); font-weight:500}
.sw[aria-checked="true"] b{color:#4ADE80}
.search{position:relative}
.search input{font:inherit; font-size:13px; width:230px; max-width:calc(100vw - 28px); box-sizing:border-box; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:8px 10px}
.search ul{list-style:none; margin:4px 0 0; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; max-height:50vh; overflow:auto; width:280px; max-width:calc(100vw - 28px); box-sizing:border-box}
.search li button{font:inherit; width:100%; text-align:left; background:none; border:0; color:var(--ink); padding:7px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:10px}
.search li button:hover,.search li button:focus-visible{background:var(--panel-2); outline:none}
.search li small{color:var(--muted); font-size:11px}
.tr{top:calc(env(safe-area-inset-top,0px) + 26px); right:52px; text-align:right; font-size:11px; color:var(--muted)}
.bl{left:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); display:grid; gap:4px}
.scale{display:flex; align-items:flex-end}
.scale i{display:block; height:6px; background:#fff; border:1px solid #000}
.scale i:nth-child(2n){background:#333}
.scalelab{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:#fff; text-shadow:0 0 3px #000}
.br{right:52px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); text-align:right; font-family:var(--mono); font-size:11px; color:var(--muted); display:grid; gap:2px}
.br .xy{font-size:13px; color:#fff; text-shadow:0 0 3px #000}
.card{position:fixed; z-index:6; width:min(320px, calc(100vw - 28px)); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.6); display:grid; gap:8px}
.card .k{font-size:11px; color:var(--muted); letter-spacing:.06em}
.card h2{margin:0; font-size:17px}
.card h2 small{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px}
.card p{margin:0; font-size:13px; line-height:1.55; color:#C9D2DC}
.card .meta{display:flex; flex-wrap:wrap; gap:6px}
.card .tag{font-size:12px; border:1px solid var(--line); border-radius:99px; padding:2px 9px; font-family:var(--mono)}
.card .x{position:absolute; top:8px; right:8px}
.card .acts{display:flex; gap:6px; flex-wrap:wrap}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.loading{position:fixed; inset:0; display:grid; place-items:center; z-index:9; background:var(--bg); color:var(--ink); font-weight:700; transition:opacity .3s}
.loading.gone{opacity:0; pointer-events:none}
@media (max-width:640px){ .tr{display:none} .br{right:14px} .search input{width:180px} }
@media (prefers-reduced-motion:reduce){ .loading{transition:none} }
.hud.tc{top:12px; left:50%; transform:translateX(-50%); max-width:calc(100vw - 32px); padding:6px 12px; border-radius:8px; background:rgba(20,24,30,.82); color:#FFD27A; font-size:13px; font-weight:600; text-align:center; pointer-events:none}
@media (max-width:700px){.hud.tc{top:auto; bottom:64px}}
</style>

</div>

  const save = () => { try { localStorage.setItem('rnmap_opt', JSON.stringify(opt)); } catch (e) {} };

  // ---- 무대(1 CSS px = 1 블록) ----
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const baseImg = new Image(); baseImg.alt = ''; baseImg.style.cssText = 'left:0;top:0;width:' + W + 'px;height:' + H + 'px';
  const hiImg = new Image(); hiImg.alt = ''; hiImg.style.cssText = 'left:0;top:0;width:' + W + 'px;height:' + H + 'px'; hiImg.hidden = true;
  stage.insertBefore(baseImg, zonesSvg); stage.insertBefore(hiImg, zonesSvg);
  const tileEls = {};
  let base = 'map';
  function setBase(b){
    base = b;
    baseImg.src = DATA.layers[b].low; hiImg.hidden = true; hiImg.removeAttribute('src');
    document.querySelectorAll('[data-base]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.base === b)));
    Object.values(tileEls).forEach(t => t.hidden = b !== 'map');
    draw();
  }
  document.querySelectorAll('[data-base]').forEach(x => x.addEventListener('click', () => setBase(x.dataset.base)));
  baseImg.onload = () => $('loading').classList.add('gone');
  setTimeout(() => $('loading').classList.add('gone'), 4000);

  // ---- 보기 상태: 화면 가운데의 블록 좌표 + 블록당 픽셀 ----
  let k = 1, cx = 0, cz = 0;
  const KMIN = () => Math.min(map.clientWidth / W, map.clientHeight / H) * 0.95, KMAX = 16;
  function fit(){ k = KMIN(); cx = DATA.home[0]; cz = DATA.home[1]; }
  const toScr = (x, z) => [(x - cx) * k + map.clientWidth / 2, (z - cz) * k + map.clientHeight / 2];
  const toBlk = (sx, sy) => [(sx - map.clientWidth / 2) / k + cx, (sy - map.clientHeight / 2) / k + cz];

  function draw(){
    k = Math.max(KMIN(), Math.min(KMAX, k));
    cx = Math.max(M.x0, Math.min(M.x1, cx)); cz = Math.max(M.z0, Math.min(M.z1, cz));
    const [ox, oy] = toScr(M.x0, M.z0);
    stage.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + k + ')';
    stage.classList.toggle('px', k >= DATA.pxK);
    if (base !== 'map' || k < 1.2) { hiImg.hidden = true; }
    else if (DATA.layers.map.mid) { if (!hiImg.getAttribute('src')) hiImg.src = DATA.layers.map.mid; hiImg.hidden = false; }
    if (base === 'map' && k >= DATA.tileK) loadTiles();
    Object.values(tileEls).forEach(t => t.hidden = !(base === 'map' && k >= DATA.tileK));
    zonesSvg.style.display = opt.zones ? '' : 'none';
    drawGrid(); drawPins(); drawScale();
  }

  // ---- 확대 타일: 보이는 지역만 불러온다 ----
  function loadTiles(){
    const [a, b] = toBlk(0, 0), [c, d] = toBlk(map.clientWidth, map.clientHeight);
    for (const t of DATA.tiles) {
      const x0 = t.x, z0 = t.z, n = t.n;
      if (x0 > c || x0 + n < a || z0 > d || z0 + n < b || tileEls[t.f]) continue;
      const im = new Image(); im.alt = ''; im.src = t.f; im.decoding = 'async';
      im.style.cssText = 'left:' + (x0 - M.x0) + 'px;top:' + (z0 - M.z0) + 'px;width:' + n + 'px;height:' + n + 'px';
      stage.insertBefore(im, zonesSvg); tileEls[t.f] = im;
    }
  }

  // ---- 격자 · 좌표 눈금 (화면 좌표로 그린다) ----
  function drawGrid(){
    const dpr = Math.min(2, window.devicePixelRatio || 1), cw = map.clientWidth, ch = map.clientHeight;
    if (gridC.width !== cw * dpr) { gridC.width = cw * dpr; gridC.height = ch * dpr; gridC.style.width = cw + 'px'; gridC.style.height = ch + 'px'; }
    const g = gridC.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, cw, ch);
    let step = 16; while (step * k < 90) step *= 2;
    const [bx0, bz0] = toBlk(0, 0), [bx1, bz1] = toBlk(cw, ch);
    if (opt.grid) {
      const lines = (st, a) => {
        g.strokeStyle = 'rgba(255,255,255,' + a + ')'; g.lineWidth = 1; g.beginPath();
        for (let x = Math.ceil(bx0 / st) * st; x <= bx1; x += st) { const s = Math.round(toScr(x, 0)[0]) + .5; g.moveTo(s, 0); g.lineTo(s, ch); }
        for (let z = Math.ceil(bz0 / st) * st; z <= bz1; z += st) { const s = Math.round(toScr(0, z)[1]) + .5; g.moveTo(0, s); g.lineTo(cw, s); }
        g.stroke();
      };
      if (opt.dense && step / 4 * k >= 12) lines(step / 4, .07);
      lines(step, .16);
    }
    if (opt.ruler) {
      g.font = '11px ' + getComputedStyle(document.body).getPropertyValue('--mono');
      g.fillStyle = 'rgba(7,9,12,.72)'; g.fillRect(0, 0, cw, 18); g.fillRect(cw - 44, 0, 44, ch);
      g.fillStyle = '#C9D2DC'; g.textBaseline = 'middle';
      g.textAlign = 'center';
      for (let x = Math.ceil(bx0 / step) * step; x <= bx1; x += step) { const s = toScr(x, 0)[0]; if (s > 24 && s < cw - 60) g.fillText(x === 0 ? 'x = 0' : String(x), s, 9); }
      g.textAlign = 'right';
      for (let z = Math.ceil(bz0 / step) * step; z <= bz1; z += step) { const s = toScr(0, z)[1]; if (s > 26 && s < ch - 8) g.fillText(z === 0 ? 'z = 0' : String(z), cw - 6, s); }
    }
  }

  // ---- 척도 막대 (1블록 = 1m) ----
  function drawScale(){
    $('scalebox').hidden = !opt.scale; if (!opt.scale) return;
    const nice = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000];
    let len = nice[0]; for (const n of nice) { if (n * k <= 160) len = n; }
    const seg = len / 2 * k;
    $('scale').innerHTML = '<i style="width:' + seg + 'px"></i><i style="width:' + seg + 'px"></i>';
    $('scalelab').style.width = (seg * 2 + 4) + 'px';
    $('scalelab').innerHTML = '<span>0</span><span>' + (len / 2) + ' m</span><span>' + len + ' m</span>';
  }

  // ---- 지명 ----
  const ICON = {
    village:'<path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/>',
    outpost:'<path d="M8 3h2v2h1V3h2v2h1V3h2v5l-1 1v12H9V9L8 8z"/>',
    dungeon:'<path d="M3 21V9l9-6 9 6v12h-6v-6a3 3 0 0 0-6 0v6z"/>',
    boss:'<path d="M12 2a8 8 0 0 0-8 8c0 3 1.5 5 3 6v4h3v-2h1v2h2v-2h1v2h3v-4c1.5-1 3-3 3-6a8 8 0 0 0-8-8zm-3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>',
    final:'<path d="M12 2a8 8 0 0 0-8 8c0 3 1.5 5 3 6v4h3v-2h1v2h2v-2h1v2h3v-4c1.5-1 3-3 3-6a8 8 0 0 0-8-8zm-3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>',
    mine:'<path d="M14 3c3 0 6 2 7 4-2-1-4-1-6 0l-9 9-3-3 9-9c1-1 1-1 2-1zM4 17l3 3-2 2-3-3z"/>',
    landmark:'<path d="M12 2 15 9l7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>',
    warp:'<path d="M12 2 7 9l5 13 5-13zm0 4 2 3-2 6-2-6z"/>',
    fish:'<path d="M3 12c3-4 8-6 13-3l4-3v12l-4-3c-5 3-10 1-13-3zm12-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>',
    ferry:'<path d="M11 3h2v6h5l-2 4H5l-1-4h7zM2 17c2 0 3-1 5-1s3 1 5 1 3-1 5-1 3 1 5 1v2c-2 0-3-1-5-1s-3 1-5 1-3-1-5-1-3 1-5 1z"/>',
  };
  const COL = {village:'#62B8FF', outpost:'#8FE3FF', dungeon:'#FF7A59', boss:'#FF5A5A', final:'#F3C44B', mine:'#C8A27A', landmark:'#9BE38D', warp:'#B48CFF', fish:'#4FD1C5', ferry:'#E9D38A'};
  const KIND_KO = {village:'마을', outpost:'탑 초소', dungeon:'던전 · 신전', boss:'', final:'', mine:'광산', landmark:'명소', warp:'워프석', fish:'낚시 명소', ferry:'나루'};
  const pinEls = [];
  DATA.places.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'pin'; d.tabIndex = 0; d.setAttribute('role', 'button'); d.setAttribute('aria-label', p.name);
    d.style.setProperty('--c', COL[p.kind]);
    d.innerHTML = '<span class="ic"><svg viewBox="0 0 24 24">' + ICON[p.kind] + '</svg></span><span class="lb">' + esc(p.label) + '</span>';
    d.addEventListener('click', e => { e.stopPropagation(); openCard(p, d); });
    d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(p, d); } });
    d.addEventListener('pointerdown', e => e.stopPropagation());
    pinsEl.appendChild(d); pinEls.push([p, d]);
  });
  function drawPins(){
    pinsEl.hidden = !opt.places; if (!opt.places) return;
    const cw = map.clientWidth, ch = map.clientHeight;
    for (const [p, d] of pinEls) {
      const [sx, sy] = toScr(p.x, p.z);
      const on = sx > -40 && sx < cw + 40 && sy > -20 && sy < ch + 20;
      d.hidden = !on; if (!on) continue;
      d.style.left = sx + 'px'; d.style.top = sy + 'px';
      const big = p.rank <= (k < 0.35 ? 1 : k < 0.7 ? 2 : 3);
      d.classList.toggle('small', !(opt.labels && big));
    }
  }

  // ---- 구역(제안) ----
  zonesSvg.setAttribute('width', W); zonesSvg.setAttribute('height', H);
  zonesSvg.setAttribute('viewBox', M.x0 + ' ' + M.z0 + ' ' + W + ' ' + H);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, a, par) => { const e = document.createElementNS(NS, tag); for (const n in a) e.setAttribute(n, a[n]); (par || zonesSvg).appendChild(e); return e; };
  DATA.zones.forEach(z => { const g = mk('g', {}); z.rects.forEach(r => mk('rect', {x:r[0], y:r[1], width:r[2] - r[0] + 1, height:r[3] - r[1] + 1, fill:z.color, 'fill-opacity':.20}, g)); });
  mk('path', {d:DATA.border, fill:'none', stroke:'rgba(255,255,255,.8)', 'stroke-width':1.5, 'vector-effect':'non-scaling-stroke'});
  DATA.zones.forEach(z => { const t = mk('text', {x:z.lx, y:z.lz, 'text-anchor':'middle', 'font-size':34, 'font-weight':700, fill:'#fff', stroke:'rgba(0,0,0,.75)', 'stroke-width':6, 'paint-order':'stroke', 'font-family':'IBM Plex Sans KR, sans-serif'}); t.textContent = z.label; });
  $('legend').innerHTML = DATA.zoneLegend.map(l => '<span><i style="background:' + l.c + '"></i>' + esc(l.t) + '</span>').join('');
  function zoneAt(x, z){ return DATA.zones.find(q => q.rects.some(r => x >= r[0] && x <= r[2] && z >= r[1] && z <= r[3])); }

  // ---- 카드 ----
  let selPin = null;
  function openCard(p, el){
    if (selPin) selPin.classList.remove('sel');
    selPin = el; if (el) el.classList.add('sel');
    const c = $('card');
    const zn = zoneAt(p.x, p.z);
    c.innerHTML = '<button class="btn icon x" type="button" aria-label="닫기" id="cardx"><svg viewBox="0 0 24 24"><path d="M6 5 5 6l6 6-6 6 1 1 6-6 6 6 1-1-6-6 6-6-1-1-6 6z"/></svg></button>' +
      '<span class="k">' + esc(KIND_KO[p.kind]) + '</span><h2>' + esc(p.name) + (p.ko && p.ko !== p.name ? '<small>' + esc(p.ko) + '</small>' : '') + '</h2>' +
      (p.desc ? '<p>' + esc(p.desc) + '</p>' : '') +
      '<div class="meta"><span class="tag">x ' + p.x + ' · z ' + p.z + (p.y ? ' · y ' + p.y : '') + '</span>' + (p.level ? '<span class="tag">Lv ' + p.level[0] + '~' + p.level[1] + '</span>' : '') + (zn ? '<span class="tag">' + esc(zn.label) + '</span>' : '') + '</div>' +
      '<div class="acts"><button class="btn" type="button" id="cardgo">여기로 확대</button><button class="btn" type="button" id="cardcp">좌표 복사</button></div>';
    c.hidden = false;
    const place = () => { const [sx, sy] = toScr(p.x, p.z); const w = c.offsetWidth, h = c.offsetHeight; let l = sx + 20, t = sy - h / 2; if (l + w > innerWidth - 60) l = sx - w - 20; if (l < 14) l = 14; t = Math.max(60, Math.min(innerHeight - h - 50, t)); c.style.left = l + 'px'; c.style.top = t + 'px'; };
    place();
    $('cardx').onclick = closeCard;
    $('cardgo').onclick = () => { flyTo(p.x, p.z, Math.max(k, 4)); setTimeout(place, 20); };
    $('cardcp').onclick = () => { const t = p.x + ' ' + (p.y || '~') + ' ' + p.z; const b = $('cardcp'); try { navigator.clipboard.writeText(t).then(() => b.textContent = '복사됨', () => b.textContent = t); } catch (e) { b.textContent = t; } };
  }
  function closeCard(){ $('card').hidden = true; if (selPin) selPin.classList.remove('sel'); selPin = null; }

  // ---- 이동 ----
  function flyTo(x, z, nk){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const s = {cx, cz, k}, e = {cx:x, cz:z, k:nk}, t0 = performance.now(), dur = reduce ? 0 : 450;
    const step = t => { const f = dur ? Math.min(1, (t - t0) / dur) : 1, q = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      cx = s.cx + (e.cx - s.cx) * q; cz = s.cz + (e.cz - s.cz) * q; k = Math.exp(Math.log(s.k) + (Math.log(e.k) - Math.log(s.k)) * q); draw(); if (f < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  const zoomAt = (f, sx, sy) => { const [bx, bz] = toBlk(sx, sy); k *= f; k = Math.max(KMIN(), Math.min(KMAX, k)); cx = bx - (sx - map.clientWidth / 2) / k; cz = bz - (sy - map.clientHeight / 2) / k; draw(); };
  map.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY); }, {passive:false});
  map.addEventListener('dblclick', e => zoomAt(2, e.clientX, e.clientY));
  const pts = new Map(); let drag = null;
  map.addEventListener('pointerdown', e => { map.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = {x:e.clientX, y:e.clientY, cx, cz, moved:false}; map.classList.add('drag'); });
  map.addEventListener('pointermove', e => {
    const [bx, bz] = toBlk(e.clientX, e.clientY);
    $('xy').textContent = 'x ' + Math.floor(bx) + ', z ' + Math.floor(bz);
    const zn = opt.zones ? zoneAt(bx, bz) : null; $('zonehere').textContent = zn ? zn.label : '';
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (drag.pd) zoomAt(dd / drag.pd, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); drag.pd = dd; drag.moved = true; return; }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    cx = drag.cx - dx / k; cz = drag.cz - dy / k; draw();
    if (!$('card').hidden && drag.moved) closeCard();
  });
  const end = e => { pts.delete(e.pointerId); if (!pts.size) { drag = null; map.classList.remove('drag'); } else if (drag) drag.pd = 0; };
  map.addEventListener('pointerup', end); map.addEventListener('pointercancel', end);
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const p = 80 / k;
    if (e.key === '+' || e.key === '=') zoomAt(1.4, map.clientWidth / 2, map.clientHeight / 2);
    else if (e.key === '-') zoomAt(1 / 1.4, map.clientWidth / 2, map.clientHeight / 2);
    else if (e.key === 'ArrowLeft') { cx -= p; draw(); } else if (e.key === 'ArrowRight') { cx += p; draw(); }
    else if (e.key === 'ArrowUp') { cz -= p; draw(); } else if (e.key === 'ArrowDown') { cz += p; draw(); }
    else if (e.key === 'Escape') closeCard();
  });
  window.addEventListener('resize', draw);

  // ---- 설정 ----
  const setbtn = $('setbtn'), setpanel = $('setpanel');
  setbtn.addEventListener('click', () => { setpanel.hidden = !setpanel.hidden; setbtn.setAttribute('aria-expanded', String(!setpanel.hidden)); });
  document.querySelectorAll('.sw').forEach(b => {
    const n = b.dataset.opt, sync = () => { b.setAttribute('aria-checked', String(!!opt[n])); b.querySelector('b').textContent = opt[n] ? '켬' : '끔'; };
    sync(); b.addEventListener('click', () => { opt[n] = !opt[n]; sync(); save(); draw(); });
  });

  // ---- 검색 ----
  const q = $('q'), qres = $('qres');
  q.addEventListener('input', () => {
    const s = q.value.trim().toLowerCase();
    if (!s) { qres.hidden = true; return; }
    const hits = DATA.places.filter(p => (p.name + ' ' + (p.ko || '') + ' ' + KIND_KO[p.kind]).toLowerCase().indexOf(s) >= 0).slice(0, 12);
    qres.innerHTML = hits.length ? hits.map((p, i) => '<li><button type="button" data-i="' + DATA.places.indexOf(p) + '">' + esc(p.label) + '<small>' + esc(KIND_KO[p.kind]) + '</small></button></li>').join('') : '<li><button type="button" disabled>찾는 장소가 없습니다</button></li>';
    qres.hidden = false;
    qres.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => {
      const p = DATA.places[+b.dataset.i]; qres.hidden = true; q.value = '';
      opt.places = true; draw(); flyTo(p.x, p.z, Math.max(k, 3));
      setTimeout(() => openCard(p, pinEls[+b.dataset.i][1]), 480);
    }));
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = qres.querySelector('[data-i]'); if (b) b.click(); } if (e.key === 'Escape') { qres.hidden = true; } });

  fit(); setBase('map');
})();
</script>
